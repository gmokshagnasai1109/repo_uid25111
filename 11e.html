<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
            font-weight: 500;
        }

        .error-message.show {
            display: block;
        }

        input.error {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }

        input.success {
            border-color: #27ae60;
            background-color: #d5f4e6;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .success-message {
            background-color: #d5f4e6;
            color: #27ae60;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            display: none;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .success-message.show {
            display: block;
        }

        .validation-hint {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registration Form</h1>
        
        <div class="success-message" id="successMessage">
            Registration successful! Welcome!
        </div>

        <form id="registrationForm" novalidate>
            <!-- Name Field -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Enter your full name"
                    required
                >
                <div class="error-message" id="nameError"></div>
                <div class="validation-hint">Name must not be empty</div>
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email"
                    required
                >
                <div class="error-message" id="emailError"></div>
                <div class="validation-hint">Email must be in valid format (e.g., user@example.com)</div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password"
                    required
                    minlength="6"
                >
                <div class="error-message" id="passwordError"></div>
                <div class="validation-hint">Password must be at least 6 characters long</div>
            </div>

            <button type="submit">Register</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const successMessage = document.getElementById('successMessage');

        // Validation functions
        function validateName(name) {
            return name.trim().length > 0;
        }

        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function validatePassword(password) {
            return password.length >= 6;
        }

        // Real-time validation for Name
        nameInput.addEventListener('blur', function() {
            if (!validateName(this.value)) {
                showError(this, 'nameError', 'Name cannot be empty');
            } else {
                clearError(this, 'nameError');
            }
        });

        nameInput.addEventListener('input', function() {
            if (validateName(this.value)) {
                clearError(this, 'nameError');
            }
        });

        // Real-time validation for Email
        emailInput.addEventListener('blur', function() {
            if (this.value && !validateEmail(this.value)) {
                showError(this, 'emailError', 'Please enter a valid email address');
            } else if (!this.value) {
                showError(this, 'emailError', 'Email cannot be empty');
            } else {
                clearError(this, 'emailError');
            }
        });

        emailInput.addEventListener('input', function() {
            if (this.value && validateEmail(this.value)) {
                clearError(this, 'emailError');
            }
        });

        // Real-time validation for Password
        passwordInput.addEventListener('blur', function() {
            if (!validatePassword(this.value)) {
                showError(this, 'passwordError', 'Password must be at least 6 characters');
            } else {
                clearError(this, 'passwordError');
            }
        });

        passwordInput.addEventListener('input', function() {
            if (validatePassword(this.value)) {
                clearError(this, 'passwordError');
            }
        });

        // Show error function
        function showError(input, errorElementId, message) {
            input.classList.remove('success');
            input.classList.add('error');
            const errorElement = document.getElementById(errorElementId);
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        // Clear error function
        function clearError(input, errorElementId) {
            input.classList.remove('error');
            input.classList.add('success');
            const errorElement = document.getElementById(errorElementId);
            errorElement.textContent = '';
            errorElement.classList.remove('show');
        }

        // Form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            successMessage.classList.remove('show');

            // Validate all fields
            let isValid = true;

            // Validate Name
            if (!validateName(nameInput.value)) {
                showError(nameInput, 'nameError', 'Name cannot be empty');
                isValid = false;
            } else {
                clearError(nameInput, 'nameError');
            }

            // Validate Email
            if (!validateEmail(emailInput.value)) {
                showError(emailInput, 'emailError', 'Please enter a valid email address');
                isValid = false;
            } else {
                clearError(emailInput, 'emailError');
            }

            // Validate Password
            if (!validatePassword(passwordInput.value)) {
                showError(passwordInput, 'passwordError', 'Password must be at least 6 characters');
                isValid = false;
            } else {
                clearError(passwordInput, 'passwordError');
            }

            // If all validations pass, show success message
            if (isValid) {
                successMessage.classList.add('show');
                console.log('Form Data:', {
                    name: nameInput.value,
                    email: emailInput.value,
                    password: '***' // Don't log actual password
                });
                // Optionally reset the form after successful submission
                setTimeout(() => {
                    form.reset();
                    successMessage.classList.remove('show');
                    nameInput.classList.remove('success');
                    emailInput.classList.remove('success');
                    passwordInput.classList.remove('success');
                }, 2000);
            }
        });
    </script>
</body>
</html>
