<!DOCTYPE html>
<html>
<head>
    <title>Sign of Product</title>
</head>
<body>

<script>
    function findSign(a, b, c, d) {
        let product = a * b * c * d;
        let message;

        if (product > 0) {
            message = "The product is " + product + " and the sign is positive (+)";
        } 
        else if (product < 0) {
            message = "The product is " + product + " and the sign is negative (-)";
        } 
        else {
            message = "The product is " + product + " (zero)";
        }

        return message;
    }

    let num1 = Number(prompt("Enter 1st number:"));
    let num2 = Number(prompt("Enter 2nd number:"));
    let num3 = Number(prompt("Enter 3rd number:"));
    let num4 = Number(prompt("Enter 4th number:"));

    alert(findSign(num1, num2, num3, num4));
</script>

</body>
</html>
