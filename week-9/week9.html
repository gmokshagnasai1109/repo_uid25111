<!DOCTYPE html>
<html>
<head>
    <title>Checking a Number</title>
</head>
<body style="background-image:url(water.jpg);background-repeat: no-repeat; background-size: cover;">
    <table border="1" cellspacing="3" cellpadding="5"
        style="width: 600px; margin: 100px auto; padding:20px;
        background-color: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        border-radius: 10px; color: black;">
        <tr>
            <td>To check even or odd:</td>
            <td><input type="number" id="num"></td>
            <td><button onclick="checkEvenOdd()">Check</button></td>
        </tr>
        <tr>
            <td>To check prime or not:</td>
            <td><input type="number" id="prime"></td>
            <td><button onclick="checkPrime()">Check</button></td>
        </tr>
        <tr>
            <td>To get factorial:</td>
            <td><input type="number" id="fact"></td>
            <td><button onclick="checkFactorial()">Check</button></td>
        </tr>
        <tr>
            <td>To verify Armstrong number or not:</td>
            <td><input type="number" id="arm"></td>
            <td><button onclick="checkArmstrong()">Check</button></td>
        </tr>
    </table>

    <script>
        function checkEvenOdd() {
            let num = Number(document.getElementById("num").value);
            if (num % 2 === 0) {
                alert("Even");
            } else {
                alert("Odd");
            }
        }

        function checkPrime() {
            let num = Number(document.getElementById("prime").value);
            let isPrime = true;

            if (num <= 1) {
                isPrime = false;
            } else {
                for (let i = 2; i <= Math.sqrt(num); i++) {
                    if (num % i === 0) {
                        isPrime = false;
                        break;
                    }
                }
            }

            if (isPrime) {
                alert("Prime Number");
            } else {
                alert("Not a Prime Number");
            }
        }

        function checkFactorial() {
            let num = Number(document.getElementById("fact").value);
            let fact = 1;

            if (num < 0) {
                alert("Factorial not defined for negative numbers");
                return;
            }

            for (let i = 1; i <= num; i++) {
                fact *= i;
            }

            alert("Factorial = " + fact);
        }

        function checkArmstrong() {
            let num = Number(document.getElementById("arm").value);
            let temp = num;
            let sum = 0;
            let digits = num.toString().length;

            while (temp > 0) {
                let digit = temp % 10;
                sum += Math.pow(digit, digits);
                temp = Math.floor(temp / 10);
            }

            if (sum === num) {
                alert("Armstrong Number");
            } else {
                alert("Not an Armstrong Number");
            }
        }
    </script>
</body>
</html>
